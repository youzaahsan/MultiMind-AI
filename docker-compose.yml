version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimind-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MultiMind AI
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=sqlite:///./data/multimind.db
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - VECTOR_DB_PATH=./data/vector_store
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
